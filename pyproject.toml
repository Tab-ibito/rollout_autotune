[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "rollout-autotune"
version = "0.3.0"
description = "A window-based concurrency controller for closed-loop policy evaluation"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dit = ["numpy>=1.24"]
training = ["numpy>=1.24", "torch>=2.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
